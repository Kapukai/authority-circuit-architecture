name: Build standards PDF

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build standards PDF
        uses: xu-cheng/latex-action@v4
        with:
          root_file: docs/tex/main.tex
          work_in_root_file_dir: true

      - name: Upload standards PDF
        uses: actions/upload-artifact@v4
        with:
          name: ACA-standards-pdf
          path: docs/tex/main.pdf
